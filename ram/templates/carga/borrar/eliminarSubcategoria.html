{% extends "./carga/base.html" %}{% block contenido %}
<div class="container mt-4">
  <h2>Eliminar Marca</h2>

  <p>
    ¿Está seguro de que desea eliminar la marca
    <strong>{{ object.nombre }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'listaSubcategorias' %}" class="btn btn-secondary">
      Cancelar
    </a>
  </form>
</div>
{% endblock %}
